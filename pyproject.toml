[project]
name = "space-autonomy"
version = "0.1.0"
description = "Simulation and evaluation testbed for autonomous spacecraft inspection robots"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["space_autonomy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
